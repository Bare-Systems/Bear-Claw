name: Release BearClaw

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Release ${{ matrix.archive_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: bareclaw-linux-x86_64
          - os: ubuntu-24.04-arm
            archive_name: bareclaw-linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Package artifact
        run: |
          mkdir -p dist
          cp zig-out/bin/bareclaw dist/bareclaw
          cp LICENSE dist/LICENSE
          tar -C dist -czf "${{ matrix.archive_name }}.tar.gz" bareclaw LICENSE

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}.tar.gz
