name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Run unit tests
        run: zig build test

  build-linux-release:
    name: Build Linux release (${{ matrix.archive_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: bareclaw-linux-x86_64
          - os: ubuntu-24.04-arm
            archive_name: bareclaw-linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build Linux release binary
        run: zig build -Doptimize=ReleaseFast
